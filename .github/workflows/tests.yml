name: Tests

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "configs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: import همه‌ی ماژول‌ها
        run: python -c "import bot, src.main"

      - name: pytest
        run: python -m pytest tests/ -q
